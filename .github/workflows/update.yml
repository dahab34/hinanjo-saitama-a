name: 避難所データ自動更新
on:
  schedule:
    - cron: '17 0 1 * *'   # 毎月1日 9:17（日本時間）
  workflow_dispatch: {}      # 手動実行ボタン
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 国土地理院から取得して再生成
        run: python tools/build.py
      - name: 変更があればコミット
        run: |
          git config user.name "hinanjo-bot"
          git config user.email "hinanjo-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "避難所データ自動更新 $(date +%Y-%m-%d)" && git push; fi
